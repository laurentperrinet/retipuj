<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Jupiter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; transition: cursor 0.3s ease; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #00E5FF; /* Video Blue */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            user-select: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { margin: 0; font-weight: 300; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
        p { opacity: 0.7; font-size: 14px; margin-top: 8px; font-weight: 300; line-height: 1.6; }
        
        #status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            display: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        #speed-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #00E5FF;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #arrow-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 0px;
            background: linear-gradient(to top, transparent, #00E5FF);
            transform-origin: bottom center;
            transform: translate(-50%, -100%);
            transition: height 0.1s ease-out;
        }
        #sun-marker {
            position: absolute;
            color: #ffff00;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #ffff00;
            transform: translate(-50%, -50%);
            display: none;
        }
        #center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(0, 229, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .zen-mode {
            cursor: none !important;
        }
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body id="body">
    <div id="ui">
        <h1>Jupiter Interior</h1>
        <p>
            Mouse distance from center controls rotation speed<br>
            View: 'P' (Texture/Grid) • Grid: 'C' • Zoom: 'S' / 'D' • Motion: 'J' 'K' 'L' 'M'<br>
            Data: 'V' • Zen Mode: 'H'
        </p>
    </div>

    <div id="center-dot"></div>

    <div id="status-overlay">
        <div id="speed-arrow">
            <div id="arrow-line"></div>
        </div>
    </div>
    <div id="sun-marker">SUN</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const VELOCITY_SENSITIVITY = 0.006; 
        const KEY_SENSITIVITY = 0.002;     
        const FRICTION = 0.98; 
        const ZOOM_SENSITIVITY = 0.05;
        const SPHERE_RADIUS = 100;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Fix Saturation/Color Accuracy
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        
        document.body.appendChild(renderer.domElement);

        // --- Materials & Textures ---
        const textureLoader = new THREE.TextureLoader();
        const jupiterTexture = textureLoader.load('PIA07782.jpg');
        jupiterTexture.colorSpace = THREE.SRGBColorSpace; // Ensure texture is treated as sRGB for correct saturation

        const wireframeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00E5FF, 
            wireframe: true,
            side: THREE.BackSide 
        });

        const textureMaterial = new THREE.MeshBasicMaterial({ 
            map: jupiterTexture,
            side: THREE.BackSide 
        });

        // --- The Interior Sphere (Surface) ---
        const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 64, 64);
        const sphere = new THREE.Mesh(geometry, textureMaterial); // Default to texture
        scene.add(sphere);

        // --- The Coordinate Grid (Overlay) ---
        // We use a slightly larger radius to prevent Z-fighting (depth flickering)
        const gridGeometry = new THREE.SphereGeometry(SPHERE_RADIUS + 0.1, 32, 32);
        const gridMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00E5FF, 
            wireframe: true, 
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.3
        });
        const gridOverlay = new THREE.Mesh(gridGeometry, gridMaterial);
        gridOverlay.visible = false; // Hidden by default
        scene.add(gridOverlay);

        // --- The SUN (Reference Point) ---
        const sunGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(SPHERE_RADIUS, 0, 0); 
        scene.add(sunMesh);

        camera.position.set(0, 0, 0);

        // --- State ---
        let mouseX = 0; 
        let mouseY = 0; 
        let rotVelX = 0;
        let rotVelY = 0;
        let showStatus = false;
        let zenMode = false;
        let isWireframe = false; // Default to texture

        // --- Interaction ---
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            
            // View Toggle (Texture vs Pure Wireframe)
            if (key === 'p') {
                isWireframe = !isWireframe;
                sphere.material = isWireframe ? wireframeMaterial : textureMaterial;
            }

            // Grid Toggle
            if (key === 'c') {
                gridOverlay.visible = !gridOverlay.visible;
            }

            // Zoom
            if (key === 's') {
                camera.fov -= 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }
            if (key === 'd') {
                camera.fov += 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }

            // Motion (JKL M)
            if (key === 'j') rotVelY += KEY_SENSITIVITY; // Left
            if (key === 'l') rotVelY -= KEY_SENSITIVITY; // Right
            if (key === 'k') rotVelX -= KEY_SENSITIVITY; // Up
            if (key === 'm') rotVelX += KEY_SENSITIVITY; // Down

            // Status
            if (key === 'v') {
                if (zenMode) return;
                showStatus = !showStatus;
                document.getElementById('status-overlay').style.display = showStatus ? 'block' : 'none';
                document.getElementById('sun-marker').style.display = showStatus ? 'block' : 'none';
            }
            
            // Zen Mode
            if (key === 'h') {
                zenMode = !zenMode;
                const body = document.getElementById('body');
                const ui = document.getElementById('ui');
                const status = document.getElementById('status-overlay');
                const sun = document.getElementById('sun-marker');
                const dot = document.getElementById('center-dot');
                
                if (zenMode) {
                    body.classList.add('zen-mode');
                    ui.classList.add('hidden');
                    status.style.display = 'none';
                    sun.style.display = 'none';
                    dot.style.opacity = '0';
                    showStatus = false;
                } else {
                    body.classList.remove('zen-mode');
                    ui.classList.remove('hidden');
                    dot.style.opacity = '1';
                }
            }
        });

        window.addEventListener('wheel', (event) => {
            camera.fov += event.deltaY * ZOOM_SENSITIVITY;
            camera.fov = Math.max(30, Math.min(120, camera.fov));
            camera.updateProjectionMatrix();
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Elements for status
        const arrowLine = document.getElementById('arrow-line');
        const sunMarker = document.getElementById('sun-marker');

        function updateStatusUI() {
            if (!showStatus || zenMode) return;
            
            const speed = Math.sqrt(rotVelX*rotVelX + rotVelY*rotVelY);
            const length = Math.min(150, speed * 1500);
            arrowLine.style.height = `${length}px`;
            
            const visualAngle = Math.atan2(mouseY, mouseX) * (180 / Math.PI);
            arrowLine.style.transform = `translate(-50%, -100%) rotate(${visualAngle + 90}deg)`;

            const vector = sunMesh.position.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            
            if (vector.z < 1) {
                sunMarker.style.left = `${x}px`;
                sunMarker.style.top = `${y}px`;
                sunMarker.style.display = 'block';
            } else {
                sunMarker.style.display = 'none';
            }
        }

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            rotVelY -= mouseX * VELOCITY_SENSITIVITY;
            rotVelX += mouseY * VELOCITY_SENSITIVITY;

            rotVelX *= FRICTION;
            rotVelY *= FRICTION;

            camera.rotation.y += rotVelY;
            camera.rotation.x += rotVelX;

            updateStatusUI();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
