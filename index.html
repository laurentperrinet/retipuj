<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Jupiter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; transition: cursor 0.3s ease; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #00ffaa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(0,255,170,0.4);
            user-select: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { margin: 0; font-weight: 300; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
        p { opacity: 0.7; font-size: 14px; margin-top: 8px; font-weight: 300; line-height: 1.6; }
        
        #footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #00ffaa;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0.5;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
        #footer a {
            color: #00ffaa;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }
        #footer a:hover {
            border-bottom-color: #00ffaa;
        }
        
        #status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            display: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        #speed-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #00ffaa;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #arrow-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 0px;
            background: linear-gradient(to top, transparent, #00ffaa);
            transform-origin: bottom center;
            transform: translate(-50%, -100%);
            transition: height 0.1s ease-out;
        }
        #sun-marker {
            position: absolute;
            color: #ffff00;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #ffff00;
            transform: translate(-50%, -50%);
            display: none;
        }
        #center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 170, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .zen-mode {
            cursor: none !important;
        }
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body id="body">
    <div id="ui">
        <h1>Retipuj: Jupiter from the Inside</h1>
        <p>
            Saccade-safe mouse navigation • Drift converges to Jupiter's rotation<br>
            Zoom: 'S' (In) / 'D' (Out) • Motion: H J K L (Vim) • Fullscreen: 'F'<br>
            Data: 'V' • Zen Mode: 'Z'
        </p>
    </div>

    <div id="footer">
        © Licensed by <a href="https://laurentperrinet.github.io" target="_blank">laurentperrinet.github.io</a>
    </div>

    <div id="center-dot"></div>

    <div id="status-overlay">
        <div id="speed-arrow">
            <div id="arrow-line"></div>
        </div>
    </div>
    <div id="sun-marker">SUN</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const MOUSE_SENSITIVITY = 0.002; 
        const KEY_SENSITIVITY = 0.0005;   
        const ZOOM_SENSITIVITY = 0.05;
        const SPHERE_RADIUS = 100;
        const MAX_VELOCITY = 2.0 * Math.PI; // Hard cap: 1 rotation per second

        // Ornstein-Uhlenbeck & Planetary Physics
        const JUPITER_ROT_VEL = 0.000176; // Planetary spin mean (rad/s)
        const OU_THETA = 0.92; // Low damping / Mean reversion rate
        const OU_SIGMA = 0.00005; // Organic volatility
        const ANCHOR_FOLLOW_RATE = 0.08; // Saccade-safe anchor speed

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- The Interior Sphere ---
        const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 64, 64);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffaa, 
            wireframe: true,
            side: THREE.BackSide 
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // --- The SUN Reference ---
        const sunGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(SPHERE_RADIUS, 0, 0); 
        scene.add(sunMesh);

        camera.position.set(0, 0, 0);

        // --- State ---
        let mouseX = 0; 
        let mouseY = 0; 
        let anchorX = 0; 
        let anchorY = 0;
        let rotVelX = 0;
        let rotVelY = 0;
        let showStatus = false;
        let zenMode = false;

        // --- Interaction ---
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            
            if (key === 's') {
                camera.fov -= 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }
            if (key === 'd') {
                camera.fov += 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }

            // Vim Motion
            if (key === 'h') rotVelY += KEY_SENSITIVITY; 
            if (key === 'l') rotVelY -= KEY_SENSITIVITY; 
            if (key === 'k') rotVelX -= KEY_SENSITIVITY; 
            if (key === 'j') rotVelX += KEY_SENSITIVITY; 

            // Fullscreen (F)
            if (key === 'f') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            if (key === 'v') {
                if (zenMode) return;
                showStatus = !showStatus;
                document.getElementById('status-overlay').style.display = showStatus ? 'block' : 'none';
                document.getElementById('sun-marker').style.display = showStatus ? 'block' : 'none';
            }
            
            if (key === 'z') {
                zenMode = !zenMode;
                const body = document.getElementById('body');
                const ui = document.getElementById('ui');
                const footer = document.getElementById('footer');
                const status = document.getElementById('status-overlay');
                const sun = document.getElementById('sun-marker');
                const dot = document.getElementById('center-dot');
                
                if (zenMode) {
                    body.classList.add('zen-mode');
                    ui.classList.add('hidden');
                    footer.classList.add('hidden');
                    status.style.display = 'none';
                    sun.style.display = 'none';
                    dot.style.opacity = '0';
                    showStatus = false;
                } else {
                    body.classList.remove('zen-mode');
                    ui.classList.remove('hidden');
                    footer.classList.remove('hidden');
                    dot.style.opacity = '1';
                }
            }
        });

        window.addEventListener('wheel', (event) => {
            camera.fov += event.deltaY * ZOOM_SENSITIVITY;
            camera.fov = Math.max(30, Math.min(120, camera.fov));
            camera.updateProjectionMatrix();
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const arrowLine = document.getElementById('arrow-line');
        const sunMarker = document.getElementById('sun-marker');

        function updateStatusUI() {
            if (!showStatus || zenMode) return;
            
            const speed = Math.sqrt(rotVelX*rotVelX + rotVelY*rotVelY);
            const length = Math.min(150, speed * 1500);
            arrowLine.style.height = `${length}px`;
            
            const visualAngle = Math.atan2(mouseY, mouseX) * (180 / Math.PI);
            arrowLine.style.transform = `translate(-50%, -100%) rotate(${visualAngle + 90}deg)`;

            const vector = sunMesh.position.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            
            if (vector.z < 1) {
                sunMarker.style.left = `${x}px`;
                sunMarker.style.top = `${y}px`;
                sunMarker.style.display = 'block';
            } else {
                sunMarker.style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. Saccade-Safe Anchor update
            anchorX += (mouseX - anchorX) * ANCHOR_FOLLOW_RATE;
            anchorY += (mouseY - anchorY) * ANCHOR_FOLLOW_RATE;

            // 2. Acceleration relative to anchor
            const accelY = (mouseX - anchorX) * -MOUSE_SENSITIVITY; 
            const accelX = (mouseY - anchorY) * MOUSE_SENSITIVITY;  

            // 3. Ornstein-Uhlenbeck Diffusion
            // Convergence to Jupiter's spin on Y, and 0 on X
            rotVelY = rotVelY + OU_THETA * (JUPITER_ROT_VEL - rotVelY) * 0.016 + (Math.random() - 0.5) * OU_SIGMA;
            rotVelX = rotVelX + OU_THETA * (0 - rotVelX) * 0.016 + (Math.random() - 0.5) * OU_SIGMA;

            rotVelY += accelY;
            rotVelX += accelX;

            // 4. Hard Velocity Cap (Max 1 rotation/sec)
            rotVelX = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, rotVelX));
            rotVelY = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, rotVelY));

            camera.rotation.y += rotVelY;
            camera.rotation.x += rotVelX;

            updateStatusUI();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
