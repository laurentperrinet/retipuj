<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Jupiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; transition: cursor 0.3s ease; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #004a8d; /* Darker Video Blue */
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(0, 74, 141, 0.4);
            user-select: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { margin: 0; font-weight: 300; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
        p { opacity: 0.8; font-size: 14px; margin-top: 8px; font-weight: 300; line-height: 1.6; }
        
        #status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            display: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        #speed-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #004a8d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #arrow-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 0px;
            background: linear-gradient(to top, transparent, #004a8d);
            transform-origin: bottom center;
            transform: translate(-50%, -100%);
            transition: height 0.1s ease-out;
        }
        #sun-marker {
            position: absolute;
            color: #ffff00;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #ffff00;
            transform: translate(-50%, -50%);
            display: none;
        }
        #center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(0, 74, 141, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .zen-mode {
            cursor: none !important;
        }
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body id="body">
    <div id="ui">
        <h1>Jupiter from Inside</h1>
        <p>
            Mouse distance from center controls rotation speed<br>
            View: 'P' (Texture/Icosahedron) • Coordinates: 'C' • Zoom: 'S' / 'D' • Motion: 'J' 'K' 'L' 'M'<br>
            Data: 'V' • Zen Mode: 'H'
        </p>
    </div>

    <div id="center-dot"></div>

    <div id="status-overlay">
        <div id="speed-arrow">
            <div id="arrow-line"></div>
        </div>
    </div>
    <div id="sun-marker">SUN</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const VELOCITY_SENSITIVITY = 0.006; 
        const KEY_SENSITIVITY = 0.002;     
        const FRICTION = 0.98; 
        const ZOOM_SENSITIVITY = 0.05;
        const SPHERE_RADIUS = 100;
        const UI_COLOR = 0x004a8d;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Materials ---
        const textureLoader = new THREE.TextureLoader();
        const jupiterTexture = textureLoader.load('PIA07782.jpg');

        const wireframeMaterial = new THREE.MeshBasicMaterial({ 
            color: UI_COLOR, 
            wireframe: true,
            side: THREE.BackSide 
        });

        const textureMaterial = new THREE.MeshBasicMaterial({ 
            map: jupiterTexture,
            side: THREE.BackSide 
        });

        // --- The Interior Sphere (Main Surface) ---
        // Icosahedron provides a much more regular tessellation than UV Sphere
        const surfaceGeometry = new THREE.SphereGeometry(SPHERE_RADIUS, 64, 64);
        const sphere = new THREE.Mesh(surfaceGeometry, textureMaterial);
        scene.add(sphere);

        // Structural view: Icosahedron
        const icoGeometry = new THREE.IcosahedronGeometry(SPHERE_RADIUS, 4);
        const icoMesh = new THREE.Mesh(icoGeometry, wireframeMaterial);
        icoMesh.visible = false;
        scene.add(icoMesh);

        // --- Coordinate Labels ---
        const labelGroup = new THREE.Group();
        labelGroup.visible = false;
        scene.add(labelGroup);

        function createLabel(text, lat, lon) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;
            
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = '32px "Crimson Pro", "Times New Roman", serif';
            ctx.fillStyle = 'rgba(0, 74, 141, 0.8)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            // Spherical to Cartesian
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            sprite.position.set(
                SPHERE_RADIUS * 1.02 * Math.sin(phi) * Math.cos(theta),
                SPHERE_RADIUS * 1.02 * Math.cos(phi),
                SPHERE_RADIUS * 1.02 * Math.sin(phi) * Math.sin(theta)
            );
            sprite.scale.set(10, 5, 1);
            return sprite;
        }

        // Generate markers every 15 degrees
        for (let lat = -90; lat <= 90; lat += 15) {
            for (let lon = 0; lon < 360; lon += 15) {
                if (Math.abs(lat) === 90) {
                    // Only one label for poles
                    if (lon === 0) {
                        labelGroup.add(createLabel(lat === 90 ? '90°N' : '90°S', lat, 0));
                    }
                } else {
                    // Only show lat labels on the prime meridian and lon labels on equator to avoid clutter, 
                    // or show all but in smaller steps. Let's show a clean grid.
                    if (lat === 0) {
                        labelGroup.add(createLabel(lon + '°', 0, lon));
                    }
                    if (lon === 0) {
                        labelGroup.add(createLabel(lat + '°', lat, 0));
                    }
                }
            }
        }

        // --- The SUN (Reference Point) ---
        const sunGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(SPHERE_RADIUS, 0, 0); 
        scene.add(sunMesh);

        camera.position.set(0, 0, 0);

        // --- State ---
        let mouseX = 0; 
        let mouseY = 0; 
        let rotVelX = 0;
        let rotVelY = 0;
        let showStatus = false;
        let zenMode = false;
        let isWireframe = false; 
        let showCoords = false;

        // --- Interaction ---
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            
            // View Toggle (P)
            if (key === 'p') {
                isWireframe = !isWireframe;
                sphere.visible = !isWireframe;
                icoMesh.visible = isWireframe;
            }

            // Coords Toggle (C)
            if (key === 'c') {
                showCoords = !showCoords;
                labelGroup.visible = showCoords;
            }

            // Zoom
            if (key === 's') {
                camera.fov -= 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }
            if (key === 'd') {
                camera.fov += 2;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            }

            // Motion (JKL M)
            if (key === 'j') rotVelY += KEY_SENSITIVITY; 
            if (key === 'l') rotVelY -= KEY_SENSITIVITY; 
            if (key === 'k') rotVelX -= KEY_SENSITIVITY; 
            if (key === 'm') rotVelX += KEY_SENSITIVITY; 

            // Status
            if (key === 'v') {
                if (zenMode) return;
                showStatus = !showStatus;
                document.getElementById('status-overlay').style.display = showStatus ? 'block' : 'none';
                document.getElementById('sun-marker').style.display = showStatus ? 'block' : 'none';
            }
            
            // Zen Mode
            if (key === 'h') {
                zenMode = !zenMode;
                const body = document.getElementById('body');
                const ui = document.getElementById('ui');
                const status = document.getElementById('status-overlay');
                const sun = document.getElementById('sun-marker');
                const dot = document.getElementById('center-dot');
                
                if (zenMode) {
                    body.classList.add('zen-mode');
                    ui.classList.add('hidden');
                    status.style.display = 'none';
                    sun.style.display = 'none';
                    dot.style.opacity = '0';
                    showStatus = false;
                } else {
                    body.classList.remove('zen-mode');
                    ui.classList.remove('hidden');
                    dot.style.opacity = '1';
                }
            }
        });

        window.addEventListener('wheel', (event) => {
            camera.fov += event.deltaY * ZOOM_SENSITIVITY;
            camera.fov = Math.max(30, Math.min(120, camera.fov));
            camera.updateProjectionMatrix();
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const arrowLine = document.getElementById('arrow-line');
        const sunMarker = document.getElementById('sun-marker');

        function updateStatusUI() {
            if (!showStatus || zenMode) return;
            
            const speed = Math.sqrt(rotVelX*rotVelX + rotVelY*rotVelY);
            const length = Math.min(150, speed * 1500);
            arrowLine.style.height = `${length}px`;
            
            const visualAngle = Math.atan2(mouseY, mouseX) * (180 / Math.PI);
            arrowLine.style.transform = `translate(-50%, -100%) rotate(${visualAngle + 90}deg)`;

            const vector = sunMesh.position.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            
            if (vector.z < 1) {
                sunMarker.style.left = `${x}px`;
                sunMarker.style.top = `${y}px`;
                sunMarker.style.display = 'block';
            } else {
                sunMarker.style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            rotVelY -= mouseX * VELOCITY_SENSITIVITY;
            rotVelX += mouseY * VELOCITY_SENSITIVITY;
            rotVelX *= FRICTION;
            rotVelY *= FRICTION;
            camera.rotation.y += rotVelY;
            camera.rotation.x += rotVelX;
            updateStatusUI();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
